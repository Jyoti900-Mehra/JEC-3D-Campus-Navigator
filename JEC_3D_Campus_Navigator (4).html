<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEC 3D Campus Navigator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--card:rgba(255,255,255,.94);--ink:#1b2233;--mute:#5a6479;--line:#d9dde6;--accent:#1f5eff;--on:#fff;--soft:#e6edff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(24,29,40,.94);--ink:#e8ecf5;--mute:#9aa4b8;--line:#2d3547;--accent:#6b97ff;--on:#0b1020;--soft:#1e2a48}}
:root[data-theme="dark"]{--card:rgba(24,29,40,.94);--ink:#e8ecf5;--mute:#9aa4b8;--line:#2d3547;--accent:#6b97ff;--on:#0b1020;--soft:#1e2a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#9cc4e8;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:relative;width:100%;height:100%;touch-action:none}
canvas#gl{display:block;width:100%;height:100%}
.lbl{position:absolute;transform:translate(-50%,-100%);padding:2px 7px;border-radius:99px;background:var(--card);color:var(--ink);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--line)}
.lbl.sel{background:var(--accent);color:var(--on);border-color:var(--accent)}
#panel{position:absolute;left:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
#panel h1{font-size:1.05rem;margin:0}
#panel .s{color:var(--mute);font-size:.8rem;margin:0 0 10px}
.blist{display:grid;gap:5px}
.b{display:block;text-align:left;width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer}
.b.on{background:var(--soft);border-color:var(--accent)}
#info{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
#info h2{margin:0;font-size:1rem}
#info ul{margin:6px 0;padding-left:18px}
.tag{display:inline-block;background:var(--soft);color:var(--accent);padding:1px 8px;border-radius:8px;font-size:.75rem;margin:0 4px 4px 0}
.tag.w{color:#a35a00}
.dir{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.88rem;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
#mini{position:absolute;right:12px;top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
#mini canvas{display:block;border-radius:8px;cursor:pointer}
#mini div{font-size:.7rem;color:var(--mute);text-align:center;margin-top:3px}
#hint{position:absolute;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.75rem;color:var(--mute);max-width:240px}
@media (max-width:700px){#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:42%}#mini{right:8px;top:8px}#hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="panel">
    <h1>Jabalpur Engineering College</h1>
    <p class="s">3D campus navigator · 255-acre campus</p>
    <div class="blist" id="blist"></div>
    <div id="info"></div>
  </div>
  <div id="mini"><canvas id="mm" width="150" height="110"></canvas><div>Mini map · tap to jump</div></div>
  <div id="hint">Drag to rotate · scroll or pinch to zoom · tap a building. Entrance is at the bottom.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
